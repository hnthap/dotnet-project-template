# Runs the same `make ci` as local development, on the same distro-built
# .NET SDK band (10.0.1xx, see global.json).
default:
  image: almalinux:10-minimal@sha256:61a5d87b6ef31f1db8ac1a6f24fe99bc90e93ecc1234c56a61fc5caf980d8a3b
  before_script:
    # Minimal images have microdnf, not dnf
    - microdnf install -y --nodocs --setopt=install_weak_deps=0 dotnet-sdk-10.0 make git-core
    # `make lockfiles` runs git; avoid "dubious ownership" if the runner's uid differs
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  cache:
    key:
      files: [Directory.Packages.props, dotnet-tools.json]
    paths: [.nuget/packages]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Inside the project dir so GitLab can cache it; ignored by .gitignore
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # The Makefile's VERSION comes from `git describe`: it needs the full history
  # and the tags, which GitLab's default shallow fetch leaves out
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: "--prune --quiet --tags"

ci:
  stage: test
  script:
    - make ci
  artifacts:
    when: always
    paths: [artifacts/]
    reports:
      junit: artifacts/test-results/*.junit.xml
    expire_in: 1 week

push-image:
  stage: deploy
  needs:
    - job: ci
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Releases: pushing the git tag v1.2.0 publishes the image tag 1.2.0
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    # Push-only credentials, so the SDK never sends them to the base image's registry
    DOTNET_CONTAINER_PUSH_REGISTRY_UNAME: $CI_REGISTRY_USER
    DOTNET_CONTAINER_PUSH_REGISTRY_PWORD: $CI_REGISTRY_PASSWORD
  script:
    # CI_REGISTRY_IMAGE is "<registry>/<lowercased project path>"
    - make image-push IMAGE_REGISTRY="$CI_REGISTRY" IMAGE_REPOSITORY="${CI_REGISTRY_IMAGE#*/}"
